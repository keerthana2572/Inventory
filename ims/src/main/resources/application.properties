spring.application.name=ims

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS Configuration
cors.allowed.origins=http://localhost:5173,http://localhost:4200

# Server Port
server.port=8080

# Data initialization - ensure schema is created first
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:Schema.sql
spring.jpa.defer-datasource-initialization=true
# LLM Configuration
llm.provider=litellm
llm.api-key=sk-SfyNGxhcv7RnQKbZFWX2LQ
llm.model=qwen-cursor
llm.base-url=https://litellm-qc.zycus.net/v1
# Strategy Configuration
strategy.pricing.default=ai
strategy.reorder.default=ai
# Async Configuration
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.thread-name-prefix=async-executor-
